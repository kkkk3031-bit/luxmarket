<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب | لوكس ماركت</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; background: var(--color-surface); }
    .login-container { width: 100%; max-width: 440px; }
    .login-card { background: var(--color-surface-elevated); border-radius: 16px; padding: 2.5rem; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .login-logo { text-align: center; margin-bottom: 2rem; }
    .login-logo .logo-mark { color: var(--color-accent); }
    .login-logo .logo-text { color: var(--color-text); }
    .login-tabs { display: flex; margin-bottom: 2rem; border-bottom: 1px solid var(--color-border); }
    .login-tab { flex: 1; padding: 0.75rem; text-align: center; cursor: pointer; border-bottom: 2px solid transparent; color: var(--color-text-secondary); font-weight: 500; transition: all 0.2s; }
    .login-tab.active { border-color: var(--color-accent); color: var(--color-text); }
    .login-tab:hover { color: var(--color-text); }
    .login-form { display: none; }
    .login-form.active { display: block; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--color-text); }
    .form-group input { width: 100%; padding: 0.875rem 1rem; border: 1px solid var(--color-border); border-radius: 8px; font-size: 1rem; font-family: inherit; transition: border-color 0.2s; }
    .form-group input:focus { outline: none; border-color: var(--color-accent); }
    .btn-login { width: 100%; padding: 1rem; font-size: 1rem; font-weight: 600; }
    .divider { display: flex; align-items: center; margin: 1.5rem 0; color: var(--color-text-muted); }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--color-border); }
    .divider span { padding: 0 1rem; font-size: 0.875rem; }
    .btn-guest { width: 100%; padding: 1rem; background: var(--color-surface); border: 2px dashed var(--color-border); border-radius: 8px; color: var(--color-text-secondary); font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .btn-guest:hover { border-color: var(--color-accent); color: var(--color-accent); background: var(--color-accent-light); }
    .btn-guest svg { width: 20px; height: 20px; }
    .form-footer { text-align: center; margin-top: 1.5rem; color: var(--color-text-secondary); font-size: 0.875rem; }
    .form-footer a { color: var(--color-accent); text-decoration: none; font-weight: 500; }
    .form-footer a:hover { text-decoration: underline; }
    .auth-message { min-height: 1.75rem; margin-bottom: 1rem; font-size: 0.95rem; font-weight: 500; }
    .auth-message.success { color: var(--color-success); }
    .auth-message.error { color: var(--color-error); }
    .auth-message.info { color: var(--color-text-secondary); }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">الانتقال للمحتوى</a>
  
  <div class="login-page">
    <div class="login-container">
      <div class="login-card">
        <div class="login-logo">
          <a href="index.html" class="logo">
            <span class="logo-mark">لوكس</span>
            <span class="logo-text">ماركت</span>
          </a>
        </div>
        
        <div class="login-tabs">
          <div class="login-tab" data-tab="login">تسجيل الدخول</div>
          <div class="login-tab active" data-tab="register">إنشاء حساب</div>
        </div>

        <div class="auth-message" id="authMessage" aria-live="polite"></div>
        
        <form class="login-form" id="loginForm">
          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" name="email" autocomplete="email" required placeholder="أدخل بريدك الإلكتروني">
          </div>
          <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" name="password" autocomplete="current-password" required placeholder="أدخل كلمة المرور">
          </div>
          <button type="submit" class="btn btn-primary btn-login">دخول</button>
          <p class="form-footer"><a href="#">نسيت كلمة المرور؟</a></p>
        </form>
        
        <form class="login-form active" id="registerForm">
          <div class="form-group">
            <label>الاسم الكامل</label>
            <input type="text" name="fullName" autocomplete="name" required placeholder="أدخل اسمك">
          </div>
          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" name="email" autocomplete="email" required placeholder="أدخل بريدك الإلكتروني">
          </div>
          <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" name="password" autocomplete="new-password" required placeholder="أنشئ كلمة مرور">
          </div>
          <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="tel" name="phone" autocomplete="tel" required placeholder="+965 xxxx xxxx">
          </div>
          <button type="submit" class="btn btn-primary btn-login">إنشاء حساب</button>
        </form>
        
        <div class="divider">
          <span>أو</span>
        </div>
        
        <a href="index.html" class="btn-guest">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
         تصفح كزائر دون تسجيل
        </a>
      </div>
    </div>
  </div>
  
  <script src="auth.js"></script>
</body>
</html>
